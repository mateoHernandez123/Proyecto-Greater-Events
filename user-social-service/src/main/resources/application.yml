spring:
  application:
    name: user-social-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://localhost:3307/user_social
    username: root
    password: insecure
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/unnoba
          jwk-set-uri: http://localhost:8080/realms/unnoba/protocol/openid-connect/certs

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

keycloak:
  admin:
    server-url: http://localhost:8080
    realm: unnoba
    client-id: pdyc
    client-secret: ${KEYCLOAK_CLIENT_SECRET:change-me}
    grant-type: client_credentials
