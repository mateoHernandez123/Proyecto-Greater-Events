# TP5 — Infraestructura local: MySQL (3 BDs), RabbitMQ, Keycloak.
# Microservicios Spring se levantan con dev-support/start-tp5.sh
#
# Puertos:
#   3307  MySQL (host; contenedor escucha 3306)
#   5672  RabbitMQ AMQP
#   15672 RabbitMQ Management UI
#   8080  Keycloak
#   8761  Eureka (script)
#   8888  Config Server (script)
#   8081  API Gateway (script)
#   8082-8084 microservicios (script)

services:
  mysql:
    image: mysql:8.0
    container_name: greater-events-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: insecure
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pinsecure"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: greater-events-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak_web:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keycloak_web
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]
    depends_on:
      - keycloakdb
    ports:
      - "8080:8080"

  keycloakdb:
    image: postgres:15
    container_name: greater-events-keycloakdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password

volumes:
  mysql_data:
  postgres_data:
